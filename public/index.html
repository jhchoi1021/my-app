<!doctype html>
<html lang="en">
  <head>
    <!-- UTF-8을 지정해 모든 브라우저에서 텍스트를 일관되게 표시합니다. -->
    <meta charset="UTF-8" />

    <!-- 작은 화면에서도 실제 화면 너비에 맞춰 페이지가 보이도록 합니다. -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- 브라우저 탭과 검색 결과에 표시될 페이지 이름입니다. -->
    <title>Junhyuk Choi | Hello World</title>

    <!-- 페이지의 모든 시각적 스타일은 별도 파일로 관리합니다. -->
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <!--
      main은 이 페이지의 핵심 콘텐츠를 뜻하는 시맨틱 HTML 요소입니다.
      클래스 이름 page-shell은 화면 전체를 가운데 정렬하는 스타일과 연결됩니다.
    -->
    <main class="page-shell">
      <!--
        소개 콘텐츠를 하나의 카드로 묶습니다.
        나중에 버튼, 사진 또는 연락처를 추가할 때 이 article 안에 넣으면 됩니다.
      -->
      <article class="welcome-card" aria-labelledby="page-title">
        <!--
          h1은 페이지의 최상위 제목입니다.
          표시 문구를 변경하려면 Hello World! 부분만 수정하세요.
        -->
        <h1 id="page-title">Hello World!</h1>

        <!--
          짧은 소개 문구입니다.
          이름 또는 소개를 바꾸려면 아래 텍스트만 수정하면 됩니다.
        -->
        <p>I'm Junhyuk Choi</p>
      </article>
    </main>
  </body>
</html>
